name: Build source-auditable adapter

on:
  push:
    branches: [main, clean-room-driver]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  LOUPECAM_COMMIT: 485ed9b1dbea028b09fe2424f9cbf083d1f4af9c
  MMCORE_COMMIT: 339e0c8fba8300eeb3452e22683c1520ae8d978a

jobs:
  build-windows-x64:
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Checkout pinned LoupeCam source
        shell: pwsh
        run: |
          git clone https://github.com/cinderblock/loupecam.git external/loupecam
          git -C external/loupecam checkout $env:LOUPECAM_COMMIT

      - name: Checkout pinned Micro-Manager device API
        shell: pwsh
        run: |
          git clone https://github.com/micro-manager/mmCoreAndDevices.git external/mmCoreAndDevices
          git -C external/mmCoreAndDevices checkout $env:MMCORE_COMMIT
          $line = Select-String external/mmCoreAndDevices/MMDevice/MMDevice.h -Pattern '^#define DEVICE_INTERFACE_VERSION 75$'
          if (-not $line) { throw 'Pinned Micro-Manager source is not Device API 75' }

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.88.0

      - name: Test and build LoupeCam C ABI
        shell: pwsh
        run: |
          cargo test --locked --manifest-path external/loupecam/Cargo.toml -p loupecam-capi --lib
          cargo build --locked --manifest-path external/loupecam/Cargo.toml --release -p loupecam-capi
          Get-ChildItem external/loupecam/target/release -Filter 'loupecam_c*'

      - name: Run clean-room factory gate
        shell: pwsh
        env:
          MMCOREANDDEVICES_ROOT: ${{ github.workspace }}/external/mmCoreAndDevices
          LOUPECAM_ROOT: ${{ github.workspace }}/external/loupecam
          LOUPECAM_LIBRARY_DIR: ${{ github.workspace }}/external/loupecam/target/release
        run: ./scripts/factory.ps1 verify -RequireNative -BuildDirectory build

      - name: Stage and hash artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory artifacts | Out-Null
          Copy-Item build/Release/mmgr_dal_LoupeCam.dll artifacts/
          Copy-Item build/Release/mmgr_dal_Toupcam_compat.dll artifacts/
          Copy-Item build/Release/toupcam_compat.dll artifacts/
          Copy-Item external/loupecam/target/release/loupecam_c.dll artifacts/
          Copy-Item LICENSE artifacts/LICENSE-ADAPTER-APACHE-2.0.txt
          Copy-Item external/loupecam/LICENSE-MIT artifacts/LICENSE-LOUPECAM-MIT.txt
          Copy-Item external/loupecam/LICENSE-APACHE artifacts/LICENSE-LOUPECAM-APACHE-2.0.txt
          Copy-Item external/mmCoreAndDevices/MMDevice/license.txt artifacts/LICENSE-MMDEVICE-BSD-3-CLAUSE.txt
          Copy-Item docs/clean-room-replacement.md artifacts/READ-ME-FIRST.md
          cargo tree --locked --manifest-path external/loupecam/Cargo.toml -p loupecam-capi | Set-Content artifacts/RUST-DEPENDENCIES.txt
          @(
            'Primary researcher: Malavika S'
            "Adapter source commit: $(git rev-parse HEAD)"
            "LoupeCam source commit: $(git -C external/loupecam rev-parse HEAD)"
            "Micro-Manager source commit: $(git -C external/mmCoreAndDevices rev-parse HEAD)"
            "Rust compiler: $(rustc --version)"
            "Cargo: $(cargo --version)"
            "CMake: $((cmake --version | Select-Object -First 1))"
            'Micro-Manager Device API: 75'
            'AI assistance: drafting and technical-verification aid; not researcher or author.'
          ) | Set-Content artifacts/BUILD-PROVENANCE.txt
          Get-FileHash artifacts/*.dll -Algorithm SHA256 | Format-Table
          Get-FileHash artifacts/*.dll -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLowerInvariant(), $_.Path.Split('\')[-1] } |
            Set-Content artifacts/SHA256SUMS.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: micromanager-clean-room-adapters-windows-x64-api75
          path: artifacts/
          if-no-files-found: error
